name: IR-048 native context dispatch census
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check census and inherited contracts
        run: |
          python3 -m unittest discover -s tests -p test_typed_ir048_census.py -v
          python3 -m unittest discover -s tests -p test_integration_001.py -v
      - name: Verify ordinary JAR contains no new observers
        run: |
          ./gradlew --no-daemon clean build
          python3 scripts/check_compiler_jar.py production
      - name: Build and audit fixture JAR
        env:
          ORG_GRADLE_PROJECT_fcIntegrationFixtures: 'true'
        run: |
          ./gradlew --no-daemon clean build
          python3 scripts/check_compiler_jar.py fixture
      - name: Fetch exact original publisher
        run: PYTHONPATH=scripts python3 -c 'from ci_typed_ir015_fetch import fetch; print(fetch("blastback"))'
      - name: Observe native dispatch, no timing
        env:
          ORG_GRADLE_PROJECT_fcIntegrationFixtures: 'true'
        run: python3 -u scripts/ci_typed_ir048_census.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ir048-native-dispatch-census
          path: build/reports/
          if-no-files-found: warn
          retention-days: 30
