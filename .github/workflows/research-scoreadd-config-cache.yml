name: SCHED-COMP-016 safe ScoreAdd config cache vs original and vanilla

on:
  workflow_dispatch:
  pull_request:
    paths:
      - src/main/java/dev/functioncompiler/ProbeConfiguration.java
      - src/main/java/dev/functioncompiler/ScoreAddCommand.java
      - scripts/ci_safe_config_cache.py
      - tests/test_safe_config_cache.py
      - docs/research/scoreadd-safe-config-cache-SCHED-COMP-016.md
      - .github/workflows/research-scoreadd-config-cache.yml

permissions:
  contents: read

concurrency:
  group: sched-comp-016-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cached-config-vs-vanilla:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: function-compiler
    steps:
      - name: Check out clean-main compiler and research harness
        uses: actions/checkout@v4
        with:
          path: function-compiler
      - name: Check out pinned reference mc-tooling
        uses: actions/checkout@v4
        with:
          repository: qwasdf-1/mc-tooling
          ref: 9b63c9e554a0cb55855c51f53b6ebe0664eefbc3
          path: mc-tooling
          token: ${{ secrets.MC_TOOLING_READ_TOKEN }}
          persist-credentials: false
      - name: Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Unit-check protocol before building
        run: |
          python3 -m py_compile scripts/ci_safe_config_cache.py
          python3 -m unittest discover -s tests -p test_safe_config_cache.py -v
      - name: Build clean-main compiler with immutable env override caching
        run: ./gradlew --no-daemon --stacktrace build
      - name: Prove dynamic config reload with no env override
        timeout-minutes: 12
        run: python3 scripts/ci_safe_config_cache.py --phase reload
      - name: Prove explicit override precedence and real vanilla quota parity
        timeout-minutes: 12
        run: python3 scripts/ci_safe_config_cache.py --phase diagnostic
      - name: Run twelve-JVM native vs original getenv vs cached CPU crossover
        timeout-minutes: 65
        run: python3 scripts/ci_safe_config_cache.py --phase timing
      - name: Preserve all semantic diagnostics, all windows and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sched-comp-016-safe-config-cache
          path: |
            function-compiler/build/benchmarks/SCHED-COMP-016/*.json
            function-compiler/build/benchmarks/SCHED-COMP-016/*.log
          if-no-files-found: warn
          retention-days: 21
