name: COMPILER-IR-030 exact 26.3 entity NBT contract inspection

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compiler-ir030-inspect
  cancel-in-progress: true

jobs:
  mapped-command-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Validate inspection parser contracts
        run: python3 -m unittest discover -s tests -p test_typed_ir030_inspect.py -v
      - name: Resolve exact Minecraft 26.3 mapped classes
        run: ./gradlew --no-daemon classes
      - name: Inspect native entity data read and result-store call paths
        run: python3 scripts/ci_typed_ir030_inspect.py
      - name: Archive source-free method inventory and exact bytecode text
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-ir030-exact-26_3-command-methods
          path: build/reports/COMPILER-IR-030-MAPPED/
          if-no-files-found: warn
          retention-days: 21
