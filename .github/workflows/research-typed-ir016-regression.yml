name: COMPILER-IR-016 post-refactor IR-014 + real Vein Miner regression

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compiler-ir016-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-post-refactor-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify Java 25 mod compiles and core typed contracts
        run: |
          ./gradlew --no-daemon build
          python3 -m unittest discover -s tests -p 'test_typed_ir014.py' -v
          python3 -m unittest discover -s tests -p 'test_typed_ir015_native.py' -v
          python3 -m unittest discover -s tests -p 'test_typed_ir016.py' -v
      - name: Four JVM nested queue, objective lifecycle and quota regression
        timeout-minutes: 35
        run: python3 scripts/ci_typed_ir014.py
      - name: Retrieve exact original SHA-pinned Vein Miner publisher archive
        run: |
          PYTHONPATH=scripts python3 -c "from ci_typed_ir015_fetch import fetch; print(fetch('veinminer'))"
      - name: Two real 215-block mining events, wrapper versus generated JVM IR
        timeout-minutes: 23
        run: python3 scripts/ci_typed_ir015_native.py
      - name: Archive original-source native regressions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-ir016-post-refactor-native-regressions
          path: |
            build/reports/COMPILER-IR-014/
            build/reports/COMPILER-IR-015-NATIVE/
            build/benchmarks/PERF-011-veinminer/vein-6-fabric-wrapper*/*.json
            build/benchmarks/PERF-011-veinminer/vein-6-fabric-wrapper*/*.log
          if-no-files-found: warn
          retention-days: 21
