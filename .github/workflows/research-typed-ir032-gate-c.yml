name: COMPILER-IR-032 Dynamic Lights Gate C baseline CPU and JFR attribution

# Expensive real Minecraft study. Manual-only by design.
# No candidate compiler optimization, production defaults or auto-reruns.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compiler-ir032-gate-c-manual
  cancel-in-progress: false

jobs:
  controlled-dynamic-lights-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 125
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Validate parser/fixture/CPU-JFR separation contracts
        run: |
          python3 -m py_compile \
            scripts/run_dynamic_lights_profile.py \
            scripts/ci_ir032_dynamic_lights_source.py \
            scripts/ci_ir032_dynamic_lights_census.py \
            scripts/ci_ir032_gate_c.py
          python3 -m unittest discover -s tests -p 'test_ir032_dynamic_lights_source.py' -v
          python3 -m unittest discover -s tests -p 'test_ir032_dynamic_lights_profile.py' -v
          python3 -m unittest discover -s tests -p 'test_ir032_dynamic_lights_census.py' -v
          python3 -m unittest discover -s tests -p 'test_ir032_gate_c.py' -v
      - name: Fetch and verify original publisher ZIP and runtime overlay contract
        run: python3 scripts/ci_ir032_dynamic_lights_source.py
      - name: Build actual Minecraft 26.3 Java 25 Fabric research server
        run: ./gradlew --no-daemon build
      - name: Four fresh uninstrumented S-M-M-S CPU arms plus two separate JFR arms
        run: python3 -u scripts/ci_ir032_gate_c.py
      - name: Archive every raw fixture, partial result, CPU manifest, and JFR stack
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-ir032-gate-c-dynamic-lights-cpu-jfr
          path: |
            build/reports/COMPILER-IR-032-GATE-C/
            build/reports/COMPILER-IR-032-DYNAMIC-LIGHTS-SOURCE/
            build/benchmarks/PERF-010/dynamic-lights-fabric-pack-on-on-idle-*/
            references/real-world/dynamic-lights-creepermeyt/
          retention-days: 21
          if-no-files-found: warn
          include-hidden-files: true
