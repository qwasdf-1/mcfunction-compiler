name: COMPILER-IR-031 exact 26.3 Marker entity writeback contract

# Archived after accepted IR-031 gate. Heavy research runs are manual-only.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compiler-ir031-inspect-\${{ github.sha }}
  cancel-in-progress: false

jobs:
  exact-mapped-marker-writeback-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Validate inspection and method-boundary tests
        run: |
          python3 -m py_compile scripts/ci_typed_ir031_inspect.py
          python3 -m unittest discover -s tests -p 'test_typed_ir031_inspect.py' -v
      - name: Resolve exact fingerprinted Minecraft 26.3 mapped classfiles
        run: ./gradlew --no-daemon classes
      - name: Inspect EntityDataAccessor, Entity.load, Marker and CustomData bytecode
        run: python3 scripts/ci_typed_ir031_inspect.py
      - name: Archive source-free mapped bytecode and lifecycle inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-ir031-marker-entity-writeback-contract
          path: build/reports/COMPILER-IR-031-MAPPED/
          if-no-files-found: warn
          retention-days: 21
