name: COMPILER-IR-015 pinned real-datapack typed IR coverage screen

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compiler-ir015-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pinned-source-only-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Validate exact IR source grammar and region segmentation
        run: |
          python3 -m unittest discover -s tests -p 'test_typed_ir015_coverage.py' -v
          python3 -m py_compile scripts/ci_typed_ir015_coverage.py scripts/ci_typed_ir015_fetch.py
      - name: SHA-verify original publisher datapacks
        run: python3 scripts/ci_typed_ir015_fetch.py
      - name: Generate direct-IR source eligibility/whole-function census
        run: python3 scripts/ci_typed_ir015_coverage.py --packs veinminer blastback
      - name: Archive full original-source classifications (not publishers' archives)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-ir015-real-datapack-coverage
          path: build/reports/COMPILER-IR-015/
          if-no-files-found: warn
          retention-days: 21
