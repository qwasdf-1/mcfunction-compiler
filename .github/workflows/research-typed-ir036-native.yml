name: COMPILER-IR-036 effect legality and backend selection native parity

# One-shot preregistered native IR-036 semantic gate.
# Revert to manual-only after exactly one workflow run launches.
on:
  workflow_dispatch:
  push:
    branches:
      - work/compiler-coverage

permissions:
  contents: read

concurrency:
  group: compiler-ir036-backend-legal
  cancel-in-progress: false

jobs:
  compiler-ir036-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Check effect legality and standalone cost-selector logic before native boot
        run: |
          python3 -m unittest discover -s tests -p 'test_typed_ir036.py' -v
          python3 -m unittest discover -s tests -p 'test_typed_ir035.py' -v
          python3 -m unittest discover -s tests -p 'test_typed_ir034.py' -v
          python3 -m unittest discover -s tests -p 'test_typed_ir008.py' -v
          python3 -m unittest discover -s tests -p 'test_typed_ir013.py' -v
          python3 -m py_compile scripts/ci_typed_ir036.py
          mkdir -p build/ir036-model-tests
          javac --release 25 -d build/ir036-model-tests \
            src/main/java/dev/functioncompiler/IR036CostModel.java \
            tests/java/dev/functioncompiler/IR036CostModelTest.java
          java -cp build/ir036-model-tests dev.functioncompiler.IR036CostModelTest
      - name: Build Java 25 Minecraft 26.3 Fabric compiler
        run: ./gradlew --no-daemon build
      - name: Four fresh actual JVMs native vs three structural cost policy choices
        timeout-minutes: 35
        run: python3 -u scripts/ci_typed_ir036.py
      - name: Four JVMs original/fused/interpreted/ASM with cost policy OFF
        timeout-minutes: 35
        run: python3 -u scripts/ci_typed_ir008.py
      - name: Six JVMs reentrant queue and low quota oracle with cost policy OFF
        timeout-minutes: 40
        run: python3 -u scripts/ci_typed_ir013.py
      - name: Preserve all Minecraft state, logs and failed arms
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-ir036-native-backend-selection
          path: |
            build/reports/COMPILER-IR-036/
            build/reports/COMPILER-IR-008/
            build/reports/COMPILER-IR-013/
          retention-days: 21
          if-no-files-found: warn
