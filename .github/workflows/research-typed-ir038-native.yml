name: COMPILER-IR-038 extended score IR and predicate CSE

# Native acceptance, not a CPU benchmark. Manual-only after initial launch.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compiler-ir038-native
  cancel-in-progress: false

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Validate new and inherited compiler contracts
        run: |
          python3 -m unittest discover -s tests -p 'test_typed_ir038.py' -v
          python3 -m unittest discover -s tests -p 'test_typed_ir037.py' -v
          python3 -m unittest discover -s tests -p 'test_typed_ir036.py' -v
          python3 -m unittest discover -s tests -p 'test_typed_ir035.py' -v
          python3 -m unittest discover -s tests -p 'test_typed_ir034.py' -v
          python3 -m unittest discover -s tests -p 'test_typed_ir017.py' -v
          python3 -m unittest discover -s tests -p 'test_typed_ir008.py' -v
          python3 -m unittest discover -s tests -p 'test_typed_ir013.py' -v
      - name: Build Java 25 Minecraft 26.3 Fabric compiler
        run: ./gradlew --no-daemon build
      - name: Five JVMs extended minmax, predicates, aliases and callback parity
        timeout-minutes: 42
        run: python3 -u scripts/ci_typed_ir038.py
      - name: Four JVMs legacy scoreboard and quota parity
        timeout-minutes: 35
        run: python3 -u scripts/ci_typed_ir008.py
      - name: Six JVMs guarded and unsafe reentrant queue controls
        timeout-minutes: 37
        run: python3 -u scripts/ci_typed_ir013.py
      - name: Archive original native state and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-ir038-native-extended-score
          path: |
            build/reports/COMPILER-IR-038/
            build/reports/COMPILER-IR-008/
            build/reports/COMPILER-IR-013/
          retention-days: 21
          if-no-files-found: warn
