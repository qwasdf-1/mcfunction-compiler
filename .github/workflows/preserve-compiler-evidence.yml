name: Preserve compiler evidence

on:
  workflow_dispatch:
  push:
    branches: [work/compiler-ir048]
    paths: ['.github/workflows/preserve-compiler-evidence.yml']
permissions:
  contents: write
  actions: read
jobs:
  archive:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: archive/compiler-evidence-ir047
          fetch-depth: 0
      - name: Copy reviewed archive tooling from triggering commit
        run: |
          git fetch origin "${{ github.sha }}"
          git show "${{ github.sha }}:scripts/archive_compiler_evidence.py" > scripts/archive_compiler_evidence.py
          git show "${{ github.sha }}:docs/research/compiler-evidence-plan.json" > docs/research/compiler-evidence-plan.json
      - name: Preserve original ZIP archives and verify digests
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/archive_compiler_evidence.py
      - name: Commit only evidence and reproducible fixtures to archive branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f evidence/compiler tests/fixtures/compiler
          git add scripts/archive_compiler_evidence.py docs/research/compiler-evidence-plan.json
          git diff --cached --quiet || git commit -m "archive: preserve original compiler research evidence and fixtures"
          git push origin HEAD:refs/heads/archive/compiler-evidence-ir047
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compiler-durable-archive-manifest
          path: evidence/compiler/manifest.json
