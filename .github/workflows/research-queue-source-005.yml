name: Queue descendant source audit (COMPILER-QUEUE-005)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-queue-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: function-compiler
    steps:
      - uses: actions/checkout@v4
        with:
          path: function-compiler
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Download SHA-pinned original publisher ZIP and trace queue descendants
        run: |
          python3 - <<'PY'
          import hashlib,json,urllib.request
          from pathlib import Path
          target=Path("references/real-world/candidates/VeinMiner-5.3.0+26.3.zip")
          target.parent.mkdir(parents=True,exist_ok=True)
          req=urllib.request.Request("https://api.modrinth.com/v2/version/5jzz5SkG",
              headers={"User-Agent":"MCFC-COMPILER-QUEUE-005/1.0"})
          with urllib.request.urlopen(req,timeout=40) as response: manifest=json.load(response)
          files=[f for f in manifest["files"] if f["filename"]=="VeinMiner-5.3.0+26.3.zip"]
          if len(files)!=1: raise SystemExit("Pinned publisher asset absent or ambiguous")
          req=urllib.request.Request(files[0]["url"],
              headers={"User-Agent":"MCFC-COMPILER-QUEUE-005/1.0"})
          with urllib.request.urlopen(req,timeout=90) as response: payload=response.read()
          expected="fa5fbfc08b54a881ec1cf255fdc2e7714c258e451d17c626309cbf5988df6e4e"
          if hashlib.sha256(payload).hexdigest()!=expected: raise SystemExit("Publisher hash mismatch")
          target.write_bytes(payload)
          print("QUEUE005_SOURCE_PIN", expected)
          PY
          python3 scripts/inspect_queue_source005.py
      - name: Archive source graph and selected original command bodies
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-queue005-source
          path: function-compiler/build/benchmarks/COMPILER-QUEUE-005/
          if-no-files-found: warn
          retention-days: 21
