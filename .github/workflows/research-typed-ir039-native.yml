name: COMPILER-IR-039 compound predicates and control flow

# One-shot native correctness launch; restore manual-only after dispatch.
on:
  workflow_dispatch:
  push:
    branches:
      - work/compiler-coverage

permissions:
  contents: read

concurrency:
  group: compiler-ir039-native
  cancel-in-progress: false

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        suite: ['039', '008', '013']
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Validate compound and inherited source contracts
        run: |
          python3 -m unittest discover -s tests -p 'test_typed_ir039.py' -v
          python3 -m unittest discover -s tests -p 'test_typed_ir038.py' -v
          python3 -m unittest discover -s tests -p 'test_typed_ir037.py' -v
          python3 -m unittest discover -s tests -p 'test_typed_ir035.py' -v
          python3 -m unittest discover -s tests -p 'test_typed_ir034.py' -v
      - name: Build Java 25 Minecraft 26.3 Fabric
        run: ./gradlew --no-daemon build
      - name: Run native differential suite
        run: python3 -u scripts/ci_typed_ir${{ matrix.suite }}.py
      - name: Archive native state and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-ir039-native-${{ matrix.suite }}
          path: build/reports/COMPILER-IR-${{ matrix.suite }}/
          retention-days: 21
          if-no-files-found: warn
