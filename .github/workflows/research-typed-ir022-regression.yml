name: COMPILER-IR-022 post-observer native IR016-019 original semantics
on:
  push:
    branches: [work/compiler-coverage]
    paths:
      - '.github/workflows/research-typed-ir022-regression.yml'
      - 'src/main/java/dev/functioncompiler/CompilerSelector022Probe.java'
      - 'src/main/java/dev/functioncompiler/mixin/CompilerSelector022Mixin.java'
      - 'src/main/java/dev/functioncompiler/mixin/CompilerForkContextChainMixin.java'
      - 'tests/test_typed_ir022_cpu.py'
      - 'scripts/ci_typed_ir022_cpu.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: compiler-ir022-native-regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unchanged-original-native:
    strategy:
      fail-fast: false
      matrix:
        suite: [ir016, ir017, ir018, ir019]
    runs-on: ubuntu-24.04
    timeout-minutes: 56
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Build native Minecraft 26.3 research mod
        run: ./gradlew --no-daemon build
      - name: Verify original selector proxy opt-in and native semantics contracts
        run: |
          python3 -m unittest discover -s tests -p 'test_typed_ir022_cpu.py' -v
          python3 -m unittest discover -s tests -p 'test_typed_ir021_cpu.py' -v
      - name: Compare native previous compiler modes against original vanilla states
        timeout-minutes: 44
        run: |
          if [ "${{ matrix.suite }}" = "ir019" ]; then
            python3 scripts/ci_typed_ir019_native.py
          else
            python3 scripts/ci_typed_${{ matrix.suite }}.py
          fi
      - name: Archive original snapshots, quota and callback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-ir022-native-regression-${{ matrix.suite }}
          path: |
            build/reports/COMPILER-IR-016/
            build/reports/COMPILER-IR-017/
            build/reports/COMPILER-IR-018/
            build/reports/COMPILER-IR-019-NATIVE/
          if-no-files-found: warn
          retention-days: 21
