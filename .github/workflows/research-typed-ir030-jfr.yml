name: COMPILER-IR-030 original Vein Miner getter/store JFR attribution
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compiler-ir030-jfr
  cancel-in-progress: true

jobs:
  native-original-jfr-attribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Validate IR030 read/write sample and runner parser contracts
        run: |
          python3 -m py_compile scripts/run_veinminer_profile.py scripts/ci_typed_ir030_jfr.py
          python3 -m unittest discover -s tests -p test_typed_ir030_jfr.py -v
      - name: Build unchanged research mod (all compiler optimizers disabled for this test)
        run: ./gradlew --no-daemon build
      - name: Download and SHA-verify original publisher archive
        run: python3 -c "import sys; sys.path.insert(0, 'scripts'); from ci_typed_ir015_fetch import fetch; print(fetch('veinminer'))"
      - name: Run two independent original compiler-off JFR gameplay profiles
        run: python3 scripts/ci_typed_ir030_jfr.py
        timeout-minutes: 37
      - name: Archive exact JFR, original event/host checks and attribution
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-ir030-original-jfr-read-write-raw
          path: |
            build/reports/COMPILER-IR-030-JFR/
            build/benchmarks/PERF-011-veinminer/vein-*/results.json
            build/benchmarks/PERF-011-veinminer/vein-*/*.log
          if-no-files-found: warn
          retention-days: 21
