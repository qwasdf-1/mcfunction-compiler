name: COMPILER-IR-023 native same-queue selector and mutable tag Set visibility
on:
  push:
    branches: [work/compiler-coverage]
    paths:
      - '.github/workflows/research-typed-ir023-visibility.yml'
      - 'scripts/ci_typed_ir023_visibility.py'
      - 'tests/test_typed_ir023_visibility.py'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: compiler-ir023-visibility-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-tag-visibility-two-jvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Build unoptimized Minecraft 26.3 research mod
        run: ./gradlew --no-daemon build
      - name: Validate native fixture definitions and immutable safety gates
        run: |
          python3 -m unittest discover -s tests -p 'test_typed_ir023_visibility.py' -v
          python3 -m unittest discover -s tests -p 'test_typed_ir023_native.py' -v
          python3 -m py_compile scripts/ci_typed_ir023_visibility.py
      - name: Same-queue native original selector tests, direct mutable Set bypass
        run: python3 scripts/ci_typed_ir023_visibility.py
      - name: Archive source-generated-only semantic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-ir023-original-visibility-two-jvm
          path: |
            build/reports/COMPILER-IR-023-VISIBILITY/results.json
            build/reports/COMPILER-IR-023-VISIBILITY/native.json
            build/reports/COMPILER-IR-023-VISIBILITY/observer.json
          if-no-files-found: warn
          retention-days: 21
