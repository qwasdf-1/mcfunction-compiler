name: SCHED-GC-006 GC phase attribution A/A

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sched-gc-006-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gc-phase-attribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 44
    defaults:
      run:
        working-directory: function-compiler
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          path: function-compiler
      - name: Check out pinned private tooling harness
        uses: actions/checkout@v4
        with:
          repository: qwasdf-1/mc-tooling
          ref: 9b63c9e554a0cb55855c51f53b6ebe0664eefbc3
          path: mc-tooling
          persist-credentials: false
          token: ${{ secrets.MC_TOOLING_READ_TOKEN }}
      - name: Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Gradle dependency cache
        uses: gradle/actions/setup-gradle@v4
      - name: Build production compiler JAR
        run: ./gradlew --no-daemon --stacktrace build
      - name: Check GC parser contracts and existing A/A statistical contracts
        run: |
          python3 -m unittest discover -s tests -p test_gc_phase_telemetry.py -v
          python3 -m unittest discover -s tests -p test_noise_aa_calibration.py -v
      - name: SCHED-GC-006 same-binary GC attribution
        timeout-minutes: 32
        run: python3 scripts/ci_gc_phase_attribution.py
      - name: Archive all results and JVM GC logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sched-gc-006-phase-attribution-raw
          path: |
            function-compiler/build/benchmarks/SCHED-GC-006/results.json
            function-compiler/build/benchmarks/SCHED-GC-006/*.log
          if-no-files-found: warn
          retention-days: 21
