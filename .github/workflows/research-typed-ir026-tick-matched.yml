name: COMPILER-IR-026 tick-matched original publisher world-state comparison
on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: compiler-ir026-tick-matched-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-publisher-three-native-jvms:
    runs-on: ubuntu-24.04
    timeout-minutes: 56
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Build original native Minecraft 26.3 with opt-in compiler
        run: ./gradlew --no-daemon build
      - name: Verify same-tick and original-publisher contracts
        run: |
          python3 -m unittest discover -s tests -p 'test_typed_ir026_blastback.py' -v
          python3 -m unittest discover -s tests -p 'test_typed_ir026_tick_matched.py' -v
          python3 -m py_compile scripts/ci_typed_ir026_tick_matched.py
      - name: Fetch exact SHA-pinned original Blastback publisher zip
        run: |
          PYTHONPATH=scripts python3 -c 'from ci_typed_ir015_fetch import fetch; print(fetch("blastback"))'
      - name: Compare original TNT world progress at the same 600 datapack ticks
        timeout-minutes: 40
        run: python3 scripts/ci_typed_ir026_tick_matched.py
      - name: Preserve tick exposure and original entity-state comparison, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-ir026-original-blastback-tick-matched
          path: |
            build/reports/COMPILER-IR-026-TICK-MATCHED/results.json
            build/reports/COMPILER-IR-026-TICK-MATCHED/native.json
            build/reports/COMPILER-IR-026-TICK-MATCHED/plan_only.json
            build/reports/COMPILER-IR-026-TICK-MATCHED/compiled.json
            build/reports/COMPILER-IR-026-TICK-MATCHED/compiled.server.log
          if-no-files-found: warn
          retention-days: 21
