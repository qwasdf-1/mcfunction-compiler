name: SCHED-COMP-010 fused-region incrementality crossover

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sched-comp-010-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fusion-incrementality:
    runs-on: ubuntu-24.04
    timeout-minutes: 44
    defaults:
      run:
        working-directory: function-compiler
    steps:
      - name: Check out compiler research
        uses: actions/checkout@v4
        with:
          path: function-compiler
      - name: Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Gradle setup
        uses: gradle/actions/setup-gradle@v4
      - name: Build compiler with opt-in namespace gate
        run: ./gradlew --no-daemon --stacktrace build
      - name: Synthetic isolation and crossover contracts
        run: |
          python3 -m unittest discover -s tests -p test_fused_incremental_crossover.py -v
          python3 -m unittest discover -s tests -p test_benchmark_crossover.py -v
      - name: Benchmark actual fusion versus typed ScoreAdd
        timeout-minutes: 34
        run: python3 scripts/ci_fused_incremental_crossover.py
      - name: Archive raw per-window evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sched-comp-010-fusion-incrementality
          path: |
            function-compiler/build/benchmarks/SCHED-COMP-010/results.json
            function-compiler/build/benchmarks/SCHED-COMP-010/*.log
          if-no-files-found: warn
          retention-days: 21
