name: COMPILER-IR-032 exact Dynamic Lights 26.3 source census

on:
  push:
    branches: [work/compiler-coverage]
    paths:
      - 'scripts/ci_ir032_dynamic_lights_source.py'
      - 'tests/test_ir032_dynamic_lights_source.py'
      - '.github/workflows/research-typed-ir032-source.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compiler-ir032-source-\${{ github.sha }}
  cancel-in-progress: false

jobs:
  exact-publisher-source-and-tick-graph:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify pinned source fetch and overlay/call-graph contracts
        run: |
          python3 -m py_compile scripts/ci_ir032_dynamic_lights_source.py
          python3 -m unittest discover -s tests -p 'test_ir032_dynamic_lights_source.py' -v
      - name: Fetch exact Modrinth v1.4.6 26.3 archive and verify publisher SHA
        run: python3 scripts/ci_ir032_dynamic_lights_source.py
      - name: Archive exact source census and call graph
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-ir032-dynamic-lights-26-3-source-census
          path: |
            build/reports/COMPILER-IR-032-DYNAMIC-LIGHTS-SOURCE/
          if-no-files-found: warn
          retention-days: 21
          include-hidden-files: true
