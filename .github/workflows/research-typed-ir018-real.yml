name: COMPILER-IR-018 pinned real Vein Miner selector compiler coverage

on:
  push:
    branches: [work/compiler-coverage]
    paths:
      - '.github/workflows/research-typed-ir018-real.yml'
      - 'scripts/ci_typed_ir018_real_event.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compiler-ir018-real-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-veinminer-three-jvms:
    runs-on: ubuntu-24.04
    timeout-minutes: 43
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Build native Minecraft 26.3 mod
        run: ./gradlew --no-daemon build
      - name: Validate script, contracts and SHA-pinned original source
        run: |
          python3 -m py_compile scripts/ci_typed_ir018_real_event.py
          python3 -m unittest discover -s tests -p 'test_typed_ir018.py' -v
          PYTHONPATH=scripts python3 -c "from ci_typed_ir015_fetch import fetch; print(fetch('veinminer'))"
      - name: Three original 215-block player mining events, vanilla versus selector off/on
        timeout-minutes: 32
        run: python3 scripts/ci_typed_ir018_real_event.py
      - name: Preserve full original-source native gameplay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-ir018-real-veinminer
          path: build/reports/COMPILER-IR-018-REAL/
          if-no-files-found: warn
          retention-days: 21
