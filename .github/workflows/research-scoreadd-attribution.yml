name: SCHED-COMP-015 typed ScoreAdd cost attribution

on:
  workflow_dispatch:
  pull_request:
    paths:
      - src/main/java/dev/functioncompiler/ScoreAddCommand.java
      - src/main/java/dev/functioncompiler/ScoreAddPrototype.java
      - src/main/java/dev/functioncompiler/ProbeConfiguration.java
      - src/main/java/dev/functioncompiler/ProbeMetrics.java
      - src/main/java/dev/functioncompiler/ProbeStatus.java
      - scripts/ci_scoreadd_attribution.py
      - tests/test_scoreadd_attribution.py
      - docs/research/scoreadd-cost-attribution-SCHED-COMP-015.md
      - .github/workflows/research-scoreadd-attribution.yml

permissions:
  contents: read

concurrency:
  group: sched-comp-015-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scoreadd-causal-attribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 86
    defaults:
      run:
        working-directory: function-compiler
    steps:
      - name: Checkout compiler research
        uses: actions/checkout@v4
        with:
          path: function-compiler
      - name: Checkout pinned native harness
        uses: actions/checkout@v4
        with:
          repository: qwasdf-1/mc-tooling
          ref: 9b63c9e554a0cb55855c51f53b6ebe0664eefbc3
          path: mc-tooling
          token: ${{ secrets.MC_TOOLING_READ_TOKEN }}
          persist-credentials: false
      - name: Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Verify Python causal contracts before Java compilation
        run: |
          python3 -m py_compile scripts/ci_scoreadd_attribution.py
          python3 -m unittest discover -s tests -p test_scoreadd_attribution.py -v
      - name: Build compiler with opt-in ScoreAdd research modes
        run: ./gradlew --no-daemon --stacktrace build
      - name: Separate hot-path phase diagnostics and intervention activation
        timeout-minutes: 14
        run: python3 scripts/ci_scoreadd_attribution.py --phase diagnostic
      - name: Run 10-JVM native/wrapper/typed/cached/objective crossover
        timeout-minutes: 65
        run: python3 scripts/ci_scoreadd_attribution.py --phase timing
      - name: Archive all phase records, paired CPU windows and server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sched-comp-015-scoreadd-cost-attribution
          path: |
            function-compiler/build/benchmarks/SCHED-COMP-015/*.json
            function-compiler/build/benchmarks/SCHED-COMP-015/*.log
          if-no-files-found: warn
          retention-days: 21
