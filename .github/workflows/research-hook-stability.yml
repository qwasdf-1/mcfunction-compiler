name: SCHED-HOOK-004 stability-first compiler-off CPU comparison

on:
  pull_request:
    paths:
      - scripts/ci_compiler_off_stability.py
      - tests/test_compiler_off_stability.py
      - .github/workflows/research-hook-stability.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stable-paired-hooks:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: function-compiler
    steps:
      - name: Check out research compiler
        uses: actions/checkout@v4
        with:
          path: function-compiler
      - name: Check out pinned private mc-tooling
        uses: actions/checkout@v4
        with:
          repository: qwasdf-1/mc-tooling
          ref: 9b63c9e554a0cb55855c51f53b6ebe0664eefbc3
          path: mc-tooling
          persist-credentials: false
          token: ${{ secrets.MC_TOOLING_READ_TOKEN }}
      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build production compiler JAR
        run: ./gradlew --no-daemon --stacktrace build
      - name: Test predeclared warmup and statistics rules
        run: python3 -m unittest discover -s tests -p test_compiler_off_stability.py -v
      - name: Run stability-first 10-pair campaign (SCHED-HOOK-004)
        timeout-minutes: 26
        run: python3 scripts/ci_compiler_off_stability.py
      - name: Preserve all measurements and per-boot server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sched-hook-004-stability-first-raw
          path: |
            function-compiler/build/benchmarks/SCHED-HOOK-004/results.json
            function-compiler/build/benchmarks/SCHED-HOOK-004/*.log
          if-no-files-found: warn
          retention-days: 21
