name: COMPILER-IR-016 mixed source-spanned program native acceptance

on:
  push:
    branches: [work/compiler-coverage]
    paths:
      - '.github/workflows/research-typed-ir016.yml'
      - 'src/main/java/dev/functioncompiler/MixedFunctionIR.java'
      - 'src/main/java/dev/functioncompiler/TypedScoreIR.java'
      - 'src/main/java/dev/functioncompiler/ProbeCommands.java'
      - 'scripts/ci_typed_ir016.py'
      - 'tests/test_typed_ir016.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compiler-ir016-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-mixed-ir:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Build Java 25 Fabric compiler and validate bytecode types
        run: ./gradlew --no-daemon build
      - name: Check mixed-program boundaries and native fixture invariants
        run: |
          python3 -m unittest discover -s tests -p 'test_typed_ir016.py' -v
          python3 -m unittest discover -s tests -p 'test_typed_ir015_native.py' -v
          python3 -m py_compile scripts/ci_typed_ir016.py
      - name: Four native Minecraft JVMs with mixed barriers and 13 quotas
        timeout-minutes: 43
        run: python3 scripts/ci_typed_ir016.py
      - name: Preserve complete four-arm native observations and ledgers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-ir016-native-mixed-ir
          path: build/reports/COMPILER-IR-016/
          if-no-files-found: warn
          retention-days: 21
