name: COMPILER-IR-018 post-selector semantic regression (IR-014, 016, 017)

on:
  push:
    branches: [work/compiler-coverage]
    paths:
      - '.github/workflows/research-typed-ir018-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compiler-ir018-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-regression:
    strategy:
      fail-fast: false
      matrix:
        suite: [ir014, ir016, ir017]
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Build exact Minecraft 26.3 compiler and validate old/new code
        run: |
          ./gradlew --no-daemon build
          python3 -m unittest discover -s tests -p 'test_typed_ir009.py' -v
          python3 -m unittest discover -s tests -p 'test_typed_ir014.py' -v
          python3 -m unittest discover -s tests -p 'test_typed_ir016.py' -v
          python3 -m unittest discover -s tests -p 'test_typed_ir017.py' -v
          python3 -m unittest discover -s tests -p 'test_typed_ir018.py' -v
      - name: Real Minecraft native differential regression
        timeout-minutes: 35
        run: python3 scripts/ci_typed_${{ matrix.suite }}.py
      - name: Preserve original-source native state, quota and callback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-ir018-regression-${{ matrix.suite }}
          path: build/reports/COMPILER-IR-014/
          if-no-files-found: warn
          retention-days: 21
