name: SCHED-ATTR-028 static NBT destination check (no game boot)

# Temporary PR trigger for one read-only scan; restore dispatch-only after result.
on:
  workflow_dispatch:
  pull_request:
    branches: [research/sched-attr-027-brigadier-context-callback-cpu]
    paths:
      - scripts/inspect_veinminer_nbt_destinations.py
      - .github/workflows/research-veinminer-nbt-targets.yml

permissions:
  contents: read

jobs:
  pinned-source-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: function-compiler
    steps:
      - uses: actions/checkout@v4
        with:
          path: function-compiler
      - name: Fetch exact pinned publisher datapack (no Minecraft server)
        env:
          MC_VEINMINER_REFERENCE_URL: ${{ secrets.MC_VEINMINER_REFERENCE_URL }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,urllib.request
          from pathlib import Path
          target=Path("references/real-world/candidates/VeinMiner-5.3.0+26.3.zip")
          target.parent.mkdir(parents=True,exist_ok=True)
          url=os.environ.get("MC_VEINMINER_REFERENCE_URL")
          if not url:
              req=urllib.request.Request(
                  "https://api.modrinth.com/v2/version/5jzz5SkG",
                  headers={"User-Agent":"MCFC-STATIC-NBT-028/1.0"})
              with urllib.request.urlopen(req,timeout=45) as response:
                  version=json.load(response)
              matches=[f for f in version["files"]
                       if f["filename"]=="VeinMiner-5.3.0+26.3.zip"]
              if len(matches)!=1:
                  raise SystemExit("Pinned publisher file not found")
              url=matches[0]["url"]
          req=urllib.request.Request(url,headers={"User-Agent":"MCFC-STATIC-NBT-028/1.0"})
          with urllib.request.urlopen(req,timeout=90) as response:
              payload=response.read()
          digest=hashlib.sha256(payload).hexdigest()
          if digest!="fa5fbfc08b54a881ec1cf255fdc2e7714c258e451d17c626309cbf5988df6e4e":
              raise SystemExit("Exact publisher archive SHA-256 mismatched")
          target.write_bytes(payload)
          print("Publisher Vein Miner ZIP SHA256 verified: "+digest)
          PY
      - name: Inspect possible storage/entity/block NBT destinations
        run: python3 scripts/inspect_veinminer_nbt_destinations.py
      - name: Archive read-only source observations (not ZIP contents)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sched-attr-028-veinminer-static-nbt-targets
          path: function-compiler/build/benchmarks/SCHED-ATTR-028/veinminer-nbt-static-targets.json
          if-no-files-found: warn
          retention-days: 21
