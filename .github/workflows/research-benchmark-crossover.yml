name: SCHED-BENCH-008 within-JVM crossover sensitivity

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sched-bench-008-${{ github.ref }}
  cancel-in-progress: true

jobs:
  within-jvm-crossover:
    runs-on: ubuntu-24.04
    timeout-minutes: 44
    defaults:
      run:
        working-directory: function-compiler
    steps:
      - name: Check out research code
        uses: actions/checkout@v4
        with:
          path: function-compiler
      - name: Check out pinned harness
        uses: actions/checkout@v4
        with:
          repository: qwasdf-1/mc-tooling
          ref: 9b63c9e554a0cb55855c51f53b6ebe0664eefbc3
          path: mc-tooling
          persist-credentials: false
          token: ${{ secrets.MC_TOOLING_READ_TOKEN }}
      - name: Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Gradle setup
        uses: gradle/actions/setup-gradle@v4
      - name: Build production compiler artifact for dependency verification
        run: ./gradlew --no-daemon --stacktrace build
      - name: Validate crossover synthetic contracts
        run: |
          python3 -m unittest discover -s tests -p test_benchmark_crossover.py -v
          python3 -m unittest discover -s tests -p test_benchmark_sensitivity.py -v
      - name: Run 12-boot within-JVM crossover
        timeout-minutes: 34
        run: python3 scripts/ci_benchmark_crossover.py
      - name: Archive raw windows and server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sched-bench-008-crossover-raw
          path: |
            function-compiler/build/benchmarks/SCHED-BENCH-008/results.json
            function-compiler/build/benchmarks/SCHED-BENCH-008/*.log
          if-no-files-found: warn
          retention-days: 21
