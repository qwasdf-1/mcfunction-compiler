name: Positioned-function call CPU attribution (COMPILER-CPU-004)

on:
  pull_request:
    paths:
      - 'src/main/java/dev/functioncompiler/CompilerPositionedCpuProbe.java'
      - 'src/main/java/dev/functioncompiler/ProbeFunctionWrapper.java'
      - 'src/main/java/dev/functioncompiler/mixin/CallFunctionMixin.java'
      - 'src/main/java/dev/functioncompiler/mixin/FunctionBuilderMixin.java'
      - 'src/main/java/dev/functioncompiler/ProbeCommands.java'
      - 'scripts/run_veinminer_profile.py'
      - 'scripts/ci_positioned_cpu004.py'
      - 'scripts/analyze_positioned_cpu004.py'
      - 'tests/test_positioned_cpu004.py'
      - '.github/workflows/research-positioned-cpu004.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu004-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: function-compiler
    steps:
      - name: Check out current compiler coverage branch
        uses: actions/checkout@v4
        with:
          path: function-compiler
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify Fabric build and CPU004 clock-control tests
        run: |
          ./gradlew build
          python3 -m unittest discover -s tests -p test_positioned_cpu004.py -v
          python3 -m py_compile scripts/ci_positioned_cpu004.py scripts/analyze_positioned_cpu004.py scripts/run_veinminer_profile.py
      - name: Pin original Vein Miner publisher artifact
        run: |
          python3 - <<'PY'
          import hashlib,json,urllib.request
          from pathlib import Path
          target=Path("references/real-world/candidates/VeinMiner-5.3.0+26.3.zip")
          target.parent.mkdir(parents=True,exist_ok=True)
          req=urllib.request.Request(
              "https://api.modrinth.com/v2/version/5jzz5SkG",
              headers={"User-Agent":"MCFC-COMPILER-CPU-004/1.0"})
          with urllib.request.urlopen(req,timeout=40) as response:
              manifest=json.load(response)
          files=[f for f in manifest["files"]
                 if f["filename"]=="VeinMiner-5.3.0+26.3.zip"]
          if len(files)!=1:
              raise SystemExit("Publisher asset is absent or ambiguous")
          req=urllib.request.Request(
              files[0]["url"],headers={"User-Agent":"MCFC-COMPILER-CPU-004/1.0"})
          with urllib.request.urlopen(req,timeout=90) as response:
              payload=response.read()
          digest=hashlib.sha256(payload).hexdigest()
          expected="fa5fbfc08b54a881ec1cf255fdc2e7714c258e451d17c626309cbf5988df6e4e"
          if digest!=expected:
              raise SystemExit("Pinned publisher SHA-256 changed")
          target.write_bytes(payload)
          print("Verified original Vein Miner SHA256",digest)
          PY
      - name: Three independent native diagnostic arms
        run: python3 scripts/ci_positioned_cpu004.py
      - name: Preserve all raw diagnostic results, even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-cpu004-positioned-raw
          path: function-compiler/build/benchmarks/COMPILER-CPU-004/
          if-no-files-found: warn
          retention-days: 21
