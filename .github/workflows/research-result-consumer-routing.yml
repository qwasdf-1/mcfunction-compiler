name: SCHED-ATTR-028 inspect native command result-consumer routing

# One-time stacked PR inspection trigger; restore dispatch-only after capture.
on:
  workflow_dispatch:
  pull_request:
    branches: [research/sched-attr-027-brigadier-context-callback-cpu]
    paths:
      - scripts/inspect_result_consumer_routing.py
      - docs/research/result-callback-routing-SCHED-ATTR-028.md
      - .github/workflows/research-result-consumer-routing.yml

permissions:
  contents: read

concurrency:
  group: sched-attr-028-inspection-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect-pinned-routing:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: function-compiler
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          path: function-compiler
      - name: Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build pinned Minecraft 26.3 Fabric dependency graph
        run: ./gradlew --no-daemon --stacktrace build
      - name: Inspect source and actual result-consumer delegate callsites
        run: python3 scripts/inspect_result_consumer_routing.py
      - name: Archive all exact bytecode and official Mojang fingerprint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sched-attr-028-original-routing-bytecode
          path: function-compiler/build/benchmarks/SCHED-ATTR-028/*
          if-no-files-found: warn
          retention-days: 21
