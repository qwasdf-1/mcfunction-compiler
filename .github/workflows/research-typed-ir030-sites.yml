name: COMPILER-IR-030 exact coordinate source-site attribution

on:
  push:
    branches: [work/compiler-coverage]
    paths:
      - 'src/main/java/dev/functioncompiler/CompilerQueueCpuProbe.java'
      - 'scripts/run_veinminer_profile.py'
      - 'scripts/analyze_typed_ir030_sites.py'
      - 'scripts/ci_typed_ir030_sites.py'
      - 'tests/test_typed_ir030_sites.py'
      - '.github/workflows/research-typed-ir030-sites.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compiler-ir030-sites
  cancel-in-progress: true

jobs:
  exact-native-site-counts:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Validate site-count parser and compile research mod
        run: |
          python3 -m py_compile scripts/run_veinminer_profile.py scripts/analyze_queue_cpu005.py scripts/analyze_typed_ir030_sites.py scripts/ci_typed_ir030_sites.py
          python3 -m unittest discover -s tests -p 'test_typed_ir030_sites.py' -v
          ./gradlew --no-daemon build
      - name: Acquire exact publisher ZIP and verify original source order
        run: python3 -c "import sys; sys.path.insert(0, 'scripts'); from ci_typed_ir015_fetch import fetch; print(fetch('veinminer'))"
      - name: Run one compiler-wrapper native event with CPU clocks disabled
        run: python3 scripts/ci_typed_ir030_sites.py
        timeout-minutes: 25
      - name: Archive native event and exact per-axis site counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-ir030-exact-native-coordinate-site-counts
          path: |
            build/reports/COMPILER-IR-030-SITES/
            build/benchmarks/PERF-011-veinminer/vein-*/
          if-no-files-found: warn
          retention-days: 21
