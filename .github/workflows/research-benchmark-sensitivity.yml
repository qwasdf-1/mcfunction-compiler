name: SCHED-BENCH-007 benchmark sensitivity controls

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sched-bench-007-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sensitivity-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    defaults:
      run:
        working-directory: function-compiler
    steps:
      - name: Check out compiler research branch
        uses: actions/checkout@v4
        with:
          path: function-compiler
      - name: Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Gradle setup
        uses: gradle/actions/setup-gradle@v4
      - name: Build production jar
        run: ./gradlew --no-daemon --stacktrace build
      - name: Validate synthetic sensitivity contracts
        run: |
          python3 -m unittest discover -s tests -p test_benchmark_sensitivity.py -v
          python3 -m unittest discover -s tests -p test_noise_aa_calibration.py -v
      - name: Run blinded A/A and positive-control campaign
        timeout-minutes: 55
        run: python3 scripts/ci_benchmark_sensitivity.py
      - name: Archive complete raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sched-bench-007-sensitivity-raw
          path: |
            function-compiler/build/benchmarks/SCHED-BENCH-007/results.json
            function-compiler/build/benchmarks/SCHED-BENCH-007/*.log
          if-no-files-found: warn
          retention-days: 21
