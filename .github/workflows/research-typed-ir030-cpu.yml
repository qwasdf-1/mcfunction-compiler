name: COMPILER-IR-030 uninstrumented original Vein Miner CPU ABBA pilot

on:
  push:
    branches: [work/compiler-coverage]
    paths:
      - 'scripts/ci_typed_ir030_cpu.py'
      - 'tests/test_typed_ir030_cpu.py'
      - '.github/workflows/research-typed-ir030-cpu.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compiler-ir030-cpu-\${{ github.sha }}
  cancel-in-progress: false

jobs:
  unchanged-publisher-uninstrumented-original-ABBA:
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Compile research mod and verify preregistered CPU contract
        run: |
          python3 -m py_compile scripts/ci_typed_ir030_cpu.py
          python3 -m unittest discover -s tests -p 'test_typed_ir030_cpu.py' -v
          ./gradlew --no-daemon build
      - name: Acquire unmodified original SHA-pinned Vein Miner publisher ZIP
        run: python3 -c "import sys; sys.path.insert(0, 'scripts'); from ci_typed_ir015_fetch import fetch; print(fetch('veinminer'))"
      - name: Four fresh JVMs original workload CPU A1-B1-B2-A2; no profiling
        run: python3 scripts/ci_typed_ir030_cpu.py
        timeout-minutes: 38
      - name: Archive ALL individual original-world manifests and CPU failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-ir030-original-world-uninstrumented-cpu-abba
          path: |
            build/reports/COMPILER-IR-030-CPU/
            build/benchmarks/PERF-011-veinminer/vein-*/
          if-no-files-found: warn
          retention-days: 21
