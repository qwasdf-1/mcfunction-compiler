name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check local documentation boundary
        run: python3 scripts/check_doc_boundary.py

  build:
    name: build (26.3 fabric)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the Gradle JVM
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build mod jar
        run: ./gradlew build

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Run unit and doc hygiene tests
        run: PYTHONPATH=. uv run --with pytest pytest tests/test_doc_hygiene.py tests/test_config_flag_semantics.py

      - name: Maintained compiler regression contracts
        run: |
          python3 -m unittest discover -s tests -p 'test_integration_001.py' -v
          for ir in 037 038 039 040 043 044 045 046 047; do python3 -m unittest discover -s tests -p "test_typed_ir${ir}.py" -v; done
          mkdir -p build/predicate-facts
          javac --release 25 -d build/predicate-facts src/main/java/dev/functioncompiler/PredicateFacts.java tests/java/dev/functioncompiler/PredicateFactsTest.java
          java -cp build/predicate-facts dev.functioncompiler.PredicateFactsTest
