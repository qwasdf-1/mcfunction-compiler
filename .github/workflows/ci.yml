name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check local documentation boundary
        run: python3 scripts/check_doc_boundary.py

  build:
    name: build (26.3 fabric)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the Gradle JVM
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build mod jar
        run: ./gradlew build

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Run unit and doc hygiene tests
        run: PYTHONPATH=. uv run --with pytest pytest tests/test_doc_hygiene.py tests/test_config_flag_semantics.py

      - name: Validate IR-032 Gate C Python contracts (no Minecraft boot)
        run: |
          python3 -m py_compile scripts/run_dynamic_lights_profile.py scripts/ci_ir032_gate_c.py
          python3 -m unittest discover -s tests -p 'test_ir032_gate_c.py' -v

      - name: Validate IR-033 identical-workload placebo A/A contracts (no Minecraft boot)
        run: |
          python3 -m py_compile scripts/ci_ir033_aa_stability.py
          python3 -m unittest discover -s tests -p 'test_ir033_aa_stability.py' -v

      - name: Validate IR-034 typed IR hoisting and older typed semantic contracts (no Minecraft boot)
        run: |
          python3 -m unittest discover -s tests -p 'test_typed_ir034.py' -v
          python3 -m unittest discover -s tests -p 'test_typed_ir008.py' -v
          python3 -m unittest discover -s tests -p 'test_typed_ir013.py' -v

      - name: Validate IR-035 typed optimizer stage and semantic barrier contracts
        run: |
          python3 -m unittest discover -s tests -p 'test_typed_ir035.py' -v

      - name: Validate IR-036 effect barriers and cost policy on Java 25
        run: |
          python3 -m unittest discover -s tests -p 'test_typed_ir036.py' -v
          python3 -m py_compile scripts/ci_typed_ir036.py
          mkdir -p build/ir036-model-tests
          javac --release 25 -d build/ir036-model-tests \
            src/main/java/dev/functioncompiler/IR036CostModel.java \
            tests/java/dev/functioncompiler/IR036CostModelTest.java
          java -cp build/ir036-model-tests dev.functioncompiler.IR036CostModelTest

      - name: Validate IR-037 prepared runtime specialization and original semantics
        run: |
          python3 -m unittest discover -s tests -p 'test_typed_ir037.py' -v
          python3 -m unittest discover -s tests -p 'test_typed_ir017.py' -v
          python3 -m py_compile scripts/ci_typed_ir017.py

      - name: Validate IR-038 extended score coverage and optimizer contracts
        run: |
          python3 -m unittest discover -s tests -p 'test_typed_ir038.py' -v
          python3 -m py_compile scripts/ci_typed_ir038.py

      - name: Validate IR-039 compound predicates, dominance CSE and native fallback contracts
        run: |
          python3 -m unittest discover -s tests -p 'test_typed_ir039.py' -v
          python3 -m py_compile scripts/ci_typed_ir039.py

      - name: Validate IR-040 predicate facts, arithmetic and crossover contracts
        run: |
          python3 -m unittest discover -s tests -p 'test_typed_ir040.py' -v
          python3 -m py_compile scripts/ci_typed_ir040.py scripts/ci_typed_ir040_cpu.py
          mkdir -p build/ir040-facts-tests
          javac --release 25 -d build/ir040-facts-tests src/main/java/dev/functioncompiler/PredicateFacts.java tests/java/dev/functioncompiler/PredicateFactsTest.java
          java -cp build/ir040-facts-tests dev.functioncompiler.PredicateFactsTest
