name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check local documentation boundary
        run: python3 scripts/check_doc_boundary.py

  build:
    name: build (26.3 fabric)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the Gradle JVM
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build mod jar
        run: ./gradlew build

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Run unit and doc hygiene tests
        run: PYTHONPATH=. uv run --with pytest pytest tests/test_doc_hygiene.py tests/test_config_flag_semantics.py

      - name: Validate IR-032 Gate C Python contracts (no Minecraft boot)
        run: |
          python3 -m py_compile scripts/run_dynamic_lights_profile.py scripts/ci_ir032_gate_c.py
          python3 -m unittest discover -s tests -p 'test_ir032_gate_c.py' -v

      - name: Validate IR-033 identical-workload placebo A/A contracts (no Minecraft boot)
        run: |
          python3 -m py_compile scripts/ci_ir033_aa_stability.py
          python3 -m unittest discover -s tests -p 'test_ir033_aa_stability.py' -v

      - name: Validate IR-034 typed IR hoisting and older typed semantic contracts (no Minecraft boot)
        run: |
          python3 -m unittest discover -s tests -p 'test_typed_ir034.py' -v
          python3 -m unittest discover -s tests -p 'test_typed_ir008.py' -v
          python3 -m unittest discover -s tests -p 'test_typed_ir013.py' -v

      - name: Validate IR-035 typed optimizer stage and semantic barrier contracts
        run: |
          python3 -m unittest discover -s tests -p 'test_typed_ir035.py' -v
