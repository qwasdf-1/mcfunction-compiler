name: COMPILER-IR-018 native selector-aware scoreboard and dispatch barriers

on:
  push:
    branches: [work/compiler-coverage]
    paths:
      - '.github/workflows/research-typed-ir018.yml'
      - 'src/main/java/dev/functioncompiler/TypedScoreIR.java'
      - 'src/main/java/dev/functioncompiler/TypedScoreIRRuntime.java'
      - 'src/main/java/dev/functioncompiler/ScoreAddCommand.java'
      - 'src/main/java/dev/functioncompiler/ScoreOperationCommand.java'
      - 'src/main/java/dev/functioncompiler/ScoreConditionCommand.java'
      - 'src/main/java/dev/functioncompiler/MixedFunctionIR.java'
      - 'src/main/java/dev/functioncompiler/ProbeCommands.java'
      - 'scripts/ci_typed_ir018.py'
      - 'tests/test_typed_ir018.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compiler-ir018-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dynamic-self-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Build real Minecraft 26.3 JVM compiler
        run: ./gradlew --no-daemon build
      - name: Check IR-018 selector and mixed-barrier contracts
        run: |
          python3 -m unittest discover -s tests -p 'test_typed_ir018.py' -v
          python3 -m py_compile scripts/ci_typed_ir018.py
      - name: Five original-source Minecraft JVM modes with entity/no-entity and low quotas
        timeout-minutes: 51
        run: python3 scripts/ci_typed_ir018.py
      - name: Preserve actual scoreboard state, original command layout and server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-ir018-source-context-native
          path: build/reports/COMPILER-IR-018/
          if-no-files-found: warn
          retention-days: 21
