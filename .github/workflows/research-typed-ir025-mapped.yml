name: COMPILER-IR-025 mapped native fork scheduler API proof
on:
  push:
    branches: [work/compiler-coverage]
    paths:
      - '.github/workflows/research-typed-ir025-mapped.yml'
      - 'scripts/ci_typed_ir025_inspect.py'
  workflow_dispatch:

permissions:
  contents: read
jobs:
  native-mapped-inspection:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Resolve and validate actual Minecraft 26.3 method signatures
        run: ./gradlew --no-daemon classes
      - name: Read mapped original JVM dispatch scheduling and scoreboard APIs
        run: python3 scripts/ci_typed_ir025_inspect.py
      - name: Archive original mapped APIs, not game binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-ir025-native-fork-mapped-inspection
          path: build/reports/COMPILER-IR-025-MAPPED/
          retention-days: 21
