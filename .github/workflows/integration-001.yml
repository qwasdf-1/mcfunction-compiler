name: Integration-001 candidate verification

on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: compiler-integration-001
  cancel-in-progress: false
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        suite: ['043', '044', '045', '046', '047', '047_cpu', '047_cpu_mixed', '047_publisher', 'default_off']
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate maintained harness
        run: |
          python3 -m py_compile scripts/ci_integration_001_off.py scripts/ci_typed_ir047*.py
          PYTHONPATH=scripts python3 -c 'import ci_typed_ir043, ci_typed_ir044, ci_typed_ir045, ci_typed_ir046, ci_typed_ir047, ci_typed_ir047_cpu, ci_typed_ir047_publisher'
      - name: Build candidate
        run: ./gradlew --no-daemon build
      - name: Static candidate boundary contracts
        run: |
          python3 -m unittest discover -s tests -p test_integration_001.py -v
          for ir in 037 038 039 040 043 044 045 046 047; do python3 -m unittest discover -s tests -p "test_typed_ir${ir}.py" -v; done
      - name: Fetch original publisher pack
        if: matrix.suite == '047_publisher'
        run: python3 scripts/ci_typed_ir015_fetch.py
      - name: Fetch frozen native census
        if: matrix.suite == '047_publisher'
        uses: actions/download-artifact@v4
        with:
          name: compiler-ir042-publisher
          run-id: 45516230461
          github-token: ${{ github.token }}
          path: build/ir042-original
      - name: Fetch accepted IR047 native artifact
        if: matrix.suite == '047'
        uses: actions/download-artifact@v4
        with:
          name: compiler-ir047-047
          run-id: 45908911065
          github-token: ${{ github.token }}
          path: build/accepted-native
      - name: Build pinned main twin
        if: matrix.suite == 'default_off'
        run: |
          git worktree add --detach "$RUNNER_TEMP/fc-main" 976806f9f7d2a72cab51837c5927bd9b176f8bab
          cd "$RUNNER_TEMP/fc-main"
          ./gradlew --no-daemon build
      - name: Execute regression or default-off screen
        env:
          FC_IR047_CENSUS_JSON: build/ir042-original/COMPILER-IR-042-PUBLISHER/census.json
          FC_IR047_WORKLOAD: ${{ matrix.suite == '047_cpu_mixed' && 'mixed' || 'pure' }}
        run: |
          suite="${{ matrix.suite }}"
          if [ "$suite" = default_off ]; then
            python3 -u scripts/ci_integration_001_off.py "$RUNNER_TEMP/fc-main"
          elif [ "$suite" = 047_cpu_mixed ]; then
            python3 -u scripts/ci_typed_ir047_cpu.py
          else
            python3 -u "scripts/ci_typed_ir${suite}.py"
          fi
          if [ "$suite" = 047 ]; then
            python3 - <<'PY'
          import json,pathlib
          ref=json.loads(next(pathlib.Path("build/accepted-native").rglob("results.json")).read_text())
          got=json.loads(pathlib.Path("build/reports/COMPILER-IR-047/results.json").read_text())
          assert got["status"]==ref["status"]=="accepted"
          assert [a["cases"] for a in got["arms"]]==[a["cases"] for a in ref["arms"]]
          assert [a.get("counts") for a in got["arms"]]==[a.get("counts") for a in ref["arms"]]
          print("INTEGRATION_NATIVE_CHECKPOINT exact states and counters")
          PY
          fi
      - name: Enforce CPU qualification
        if: matrix.suite == '047_cpu' || matrix.suite == '047_cpu_mixed' || matrix.suite == 'default_off'
        run: |
          python3 - <<'PY'
          import json, pathlib
          paths={"047_cpu":"COMPILER-IR-047-CPU-PURE","047_cpu_mixed":"COMPILER-IR-047-CPU-MIXED","default_off":"INTEGRATION-001-OFF"}
          data=json.loads((pathlib.Path("build/reports")/paths["${{ matrix.suite }}"]/"results.json").read_text())
          passed=data.get("gate_pass",data.get("summary",{}).get("pilot_gate_pass",False))
          if not passed: raise SystemExit("INTEGRATION CPU gate not qualified; preserve raw evidence")
          PY
      - name: Archive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-001-${{ matrix.suite }}
          path: build/reports/
          retention-days: 30
          if-no-files-found: warn
