name: COMPILER-IR-023 official 26.3 entity mutation lifecycle method inspection
on:
  push:
    branches: [work/compiler-coverage]
    paths:
      - '.github/workflows/research-typed-ir023-inspect.yml'
      - 'scripts/ci_typed_ir023_inspect.py'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: compiler-ir023-inspect-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mapped-mutation-method-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Compile original mapped Minecraft 26.3 environment
        run: ./gradlew --no-daemon compileJava
      - name: Inspect actual tag, removal, spawn and entity lifecycle methods
        run: python3 scripts/ci_typed_ir023_inspect.py
      - name: Archive mapped descriptions without Minecraft class files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-ir023-mapped-tag-lifecycle
          path: build/reports/COMPILER-IR-023-MAPPED/
          if-no-files-found: warn
          retention-days: 21
