name: SCHED-COMP-009 actual ScoreAdd specialization crossover

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sched-comp-009-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-scoreadd-crossover:
    runs-on: ubuntu-24.04
    timeout-minutes: 44
    defaults:
      run:
        working-directory: function-compiler
    steps:
      - name: Check out compiler research branch
        uses: actions/checkout@v4
        with:
          path: function-compiler
      - name: Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Gradle setup
        uses: gradle/actions/setup-gradle@v4
      - name: Build exact production compiler JAR
        run: ./gradlew --no-daemon --stacktrace build
      - name: Run synthetic compiler activation and crossover contracts
        run: |
          python3 -m unittest discover -s tests -p test_compiler_scoreadd_crossover.py -v
          python3 -m unittest discover -s tests -p test_benchmark_crossover.py -v
      - name: Run actual compiler ScoreAdd specialization experiment
        timeout-minutes: 34
        run: python3 scripts/ci_compiler_scoreadd_crossover.py
      - name: Upload complete primary data and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sched-comp-009-scoreadd-crossover-raw
          path: |
            function-compiler/build/benchmarks/SCHED-COMP-009/results.json
            function-compiler/build/benchmarks/SCHED-COMP-009/*.log
          if-no-files-found: warn
          retention-days: 21
