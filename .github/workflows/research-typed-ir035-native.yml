name: COMPILER-IR-035 typed optimizer pass native semantic parity

# One-shot launch for the preregistered IR-035 native semantic campaign.
# Restore manual-only after creating exactly one native workflow run.
on:
  workflow_dispatch:
  push:
    branches:
      - work/compiler-coverage

permissions:
  contents: read

concurrency:
  group: compiler-ir035-optimizer-native
  cancel-in-progress: false

jobs:
  typed-optimizer-native-semantics:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Check optimizer plan and earlier interpreter/reentrancy contracts
        run: |
          python3 -m unittest discover -s tests -p 'test_typed_ir035.py' -v
          python3 -m unittest discover -s tests -p 'test_typed_ir034.py' -v
          python3 -m unittest discover -s tests -p 'test_typed_ir008.py' -v
          python3 -m unittest discover -s tests -p 'test_typed_ir013.py' -v
          python3 -m py_compile scripts/ci_typed_ir008.py scripts/ci_typed_ir013.py
      - name: Build Minecraft 26.3 Fabric mod on Java 25
        run: ./gradlew --no-daemon build
      - name: Four actual JVMs native/fused/interpreted/ASM differential semantics
        timeout-minutes: 42
        run: python3 -u scripts/ci_typed_ir008.py
      - name: Six actual JVMs with reentrant scoreboard callbacks and quota controls
        timeout-minutes: 44
        run: python3 -u scripts/ci_typed_ir013.py
      - name: Archive all native state, diagnostics and raw server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-ir035-optimizer-native-parity
          path: |
            build/reports/COMPILER-IR-008/
            build/reports/COMPILER-IR-013/
          retention-days: 21
          if-no-files-found: warn
