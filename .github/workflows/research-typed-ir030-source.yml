name: COMPILER-IR-030 original Vein Miner source-order gate
on:
  push:
    branches: [work/compiler-coverage]
    paths:
      - '.github/workflows/research-typed-ir030-source.yml'
      - 'scripts/ci_typed_ir030_source.py'
      - 'tests/test_typed_ir030_source.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compiler-ir030-source
  cancel-in-progress: true

jobs:
  original-publisher-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Check exact source-sequence parser
        run: python3 -m unittest discover -s tests -p test_typed_ir030_source.py -v
      - name: Acquire and verify unchanged original publisher ZIP
        run: python3 -c "import sys; sys.path.insert(0, 'scripts'); from ci_typed_ir015_fetch import fetch; print(fetch('veinminer'))"
      - name: Verify original command sequence and uniqueness
        run: python3 scripts/ci_typed_ir030_source.py
      - name: Preserve exact source proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-ir030-original-publisher-source-order
          path: build/reports/COMPILER-IR-030-SOURCE/
          if-no-files-found: warn
          retention-days: 21
