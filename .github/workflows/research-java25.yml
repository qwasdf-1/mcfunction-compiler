name: Research toolchain (Java 25)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java25-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle dependency cache
        uses: gradle/actions/setup-gradle@v4
      - name: Record runtime and toolchain versions
        run: |
          java --version
          javac --version
          ./gradlew --version
          cat gradle.properties
          cat gradle/wrapper/gradle-wrapper.properties
      - name: Resolve dependencies and compile mod
        run: ./gradlew --no-daemon --stacktrace classes
      - name: Run Python harness unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
