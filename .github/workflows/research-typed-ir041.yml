name: COMPILER-IR-041 steady-state CPU qualification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compiler-ir041-cpu
  cancel-in-progress: false

jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify fixed protocol contracts
        run: |
          python3 -m unittest discover -s tests -p 'test_typed_ir041.py' -v
          python3 -m py_compile scripts/ci_typed_ir041.py scripts/ci_typed_ir041_source.py
      - name: Build Minecraft Java 25
        run: ./gradlew --no-daemon build
      - name: Run bounded steady-state CPU protocol
        run: python3 -u scripts/ci_typed_ir041.py
      - name: Archive every warmup and treatment sample
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-ir041-cpu
          path: build/reports/COMPILER-IR-041/
          retention-days: 21
          if-no-files-found: warn
  publisher-census:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Fetch unchanged SHA-pinned publisher archives
        run: python3 scripts/ci_typed_ir015_fetch.py
      - name: Screen current compiler source candidates
        run: python3 -u scripts/ci_typed_ir041_source.py
      - name: Archive source census
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-ir041-publisher-census
          path: build/reports/COMPILER-IR-041-SOURCE/
          retention-days: 21
          if-no-files-found: warn
