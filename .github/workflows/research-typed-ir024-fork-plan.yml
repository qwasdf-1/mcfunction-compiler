name: COMPILER-IR-024 compiler native selector fork-plan admission and parity
on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: compiler-ir024-fork-plan-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-versus-compiler-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Build unchanged native Minecraft and opt-in research compiler
        run: ./gradlew --no-daemon build
      - name: Verify compiled IR native-barrier classification and immutable safety
        run: |
          python3 -m unittest discover -s tests -p 'test_typed_ir024_fork_plan.py' -v
          python3 -m unittest discover -s tests -p 'test_typed_ir016.py' -v
          python3 -m py_compile scripts/ci_typed_ir024_fork_plan.py
      - name: Real native selector, typed JVM neighbors and quota-parity matrix
        run: python3 scripts/ci_typed_ir024_fork_plan.py
      - name: Archive compiler plan and full native scoreboard snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-ir024-native-fork-plan-admission
          path: |
            build/reports/COMPILER-IR-024/results.json
            build/reports/COMPILER-IR-024/native.json
            build/reports/COMPILER-IR-024/fork_plan.json
            build/reports/COMPILER-IR-024/fork_plan.server.log
          if-no-files-found: warn
          retention-days: 21
