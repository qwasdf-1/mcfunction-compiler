name: Queue macro predicate and append CPU (COMPILER-CPU-005)

on:
  pull_request:
    paths:
      - '.github/workflows/research-queue-cpu005.yml'
      - 'src/main/java/dev/functioncompiler/CompilerQueueCpuProbe.java'
      - 'src/main/java/dev/functioncompiler/mixin/CompilerQueueBuildCpuMixin.java'
      - 'src/main/java/dev/functioncompiler/mixin/CompilerQueueExecuteCpuMixin.java'
      - 'src/main/java/dev/functioncompiler/ProbeFunctionWrapper.java'
      - 'src/main/java/dev/functioncompiler/mixin/FunctionBuilderMixin.java'
      - 'src/main/java/dev/functioncompiler/ProbeCommands.java'
      - 'src/main/resources/function_compiler.mixins.json'
      - 'scripts/ci_queue_cpu005.py'
      - 'scripts/analyze_queue_cpu005.py'
      - 'tests/test_queue_cpu005.py'
      - 'scripts/run_veinminer_profile.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  queue-cpu-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: function-compiler
    steps:
      - uses: actions/checkout@v4
        with:
          path: function-compiler
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Validate Fabric build and CPU005 five-stream parser contracts
        run: |
          ./gradlew build
          python3 -m unittest discover -s tests -p test_queue_cpu005.py -v
          python3 -m py_compile scripts/ci_queue_cpu005.py scripts/analyze_queue_cpu005.py scripts/run_veinminer_profile.py
      - name: Download SHA-pinned original Vein Miner publisher ZIP
        run: |
          python3 - <<'PY'
          import hashlib,json,urllib.request
          from pathlib import Path
          target=Path("references/real-world/candidates/VeinMiner-5.3.0+26.3.zip")
          target.parent.mkdir(parents=True,exist_ok=True)
          req=urllib.request.Request("https://api.modrinth.com/v2/version/5jzz5SkG",
              headers={"User-Agent":"MCFC-COMPILER-CPU005/1.0"})
          with urllib.request.urlopen(req,timeout=40) as response: manifest=json.load(response)
          files=[f for f in manifest["files"] if f["filename"]=="VeinMiner-5.3.0+26.3.zip"]
          if len(files)!=1: raise SystemExit("Publisher file missing or ambiguous")
          req=urllib.request.Request(files[0]["url"],
              headers={"User-Agent":"MCFC-COMPILER-CPU005/1.0"})
          with urllib.request.urlopen(req,timeout=90) as response: payload=response.read()
          pin="fa5fbfc08b54a881ec1cf255fdc2e7714c258e451d17c626309cbf5988df6e4e"
          if hashlib.sha256(payload).hexdigest()!=pin: raise SystemExit("Publisher hash mismatch")
          target.write_bytes(payload)
          print("CPU005_SOURCE_PIN",pin)
          PY
      - name: Execute three independent native CPU-clock diagnostic arms
        run: python3 scripts/ci_queue_cpu005.py
      - name: Retain all compact raw clock rows and startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-cpu005-queue-raw
          path: function-compiler/build/benchmarks/COMPILER-CPU-005/
          if-no-files-found: warn
          retention-days: 21
