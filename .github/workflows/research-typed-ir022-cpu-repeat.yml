name: COMPILER-IR-022 independent native selector candidate CPU replication
on:
  push:
    branches: [work/compiler-coverage]
    paths:
      - '.github/workflows/research-typed-ir022-cpu-repeat.yml'
      - 'src/main/java/dev/functioncompiler/CompilerSelector022Probe.java'
      - 'src/main/java/dev/functioncompiler/mixin/CompilerForkContextChainMixin.java'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: compiler-ir022-cpu-repeat-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-native-selector-candidates:
    runs-on: ubuntu-24.04
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Build original Minecraft 26.3 native observer mod
        run: ./gradlew --no-daemon build
      - name: Check source pin, delegated native predicate, clock and control contracts
        run: |
          python3 -m unittest discover -s tests -p 'test_typed_ir022_cpu.py' -v
          python3 -m unittest discover -s tests -p 'test_typed_ir021_cpu.py' -v
          python3 -m py_compile scripts/ci_typed_ir022_cpu.py
      - name: Fetch unchanged SHA-256 publisher Blastback Hotfix 3 archive
        run: |
          PYTHONPATH=scripts python3 -c "from ci_typed_ir015_fetch import fetch; print(fetch('blastback'))"
      - name: Run four original Java25/Minecraft26.3 CONTROL PLAIN EMPTY TIMED worlds
        timeout-minutes: 44
        run: python3 scripts/ci_typed_ir022_cpu.py
      - name: Preserve exact original scan, filtering, clock and world evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-ir022-independent-selector-native-candidate-cpu
          path: build/reports/COMPILER-IR-022-CPU/
          if-no-files-found: warn
          retention-days: 21
