name: SCHED-GC-006 offline reconstruction contracts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-gc-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Run GC reconstruction contract tests
        run: python3 -m unittest discover -s tests -p test_gc_cycle_reconstruction.py -v
      - name: Verify Python module syntax
        run: python3 -m py_compile scripts/gc_cycle_reconstruction.py scripts/analyze_gc006_archive.py
